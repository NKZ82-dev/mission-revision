<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mission Révision</title>
  <meta name="description" content="Quiz de révision alimenté par un dossier Google Drive">
  <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1220" media="(prefers-color-scheme: dark)">
  <script>
    /* Applique le thème choisi avant l'affichage (évite un flash clair/sombre) */
    try { var t = JSON.parse(localStorage.getItem('mr.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Révision">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"><div class="boot">Chargement…</div></main>
  <script src="app.js"></script>
</body>
</html>
